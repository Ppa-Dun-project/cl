apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppa-dun-be
spec:
  replicas: {{ .Values.ppaDunBe.replicas }}
  selector:
    matchLabels:
      app: ppa-dun-be
  template:
    metadata:
      labels:
        app: ppa-dun-be
    spec:
      # Bind pod to the ServiceAccount that has Workload Identity → app-secrets-sa@v2-ppa-dun.iam.
      # This is needed for the Vertex AI client (be/pages/ai.py) to fetch GCP credentials
      # via the metadata server; without it the pod runs as `default` KSA and gets no token.
      serviceAccountName: ppa-dun-secrets-ksa
      containers:
        - name: ppa-dun-be
          image: "{{ .Values.ppaDunBe.image }}:{{ .Values.ppaDunBe.tag }}"
          ports:
            - containerPort: {{ .Values.ppaDunBe.port }}
          env:
            - name: GCP_PROJECT_ID
              value: {{ .Values.ppaDunBe.vertex.projectId | quote }}
            - name: GCP_LOCATION
              value: {{ .Values.ppaDunBe.vertex.location | quote }}
            - name: VERTEX_AI_MODEL
              value: {{ .Values.ppaDunBe.vertex.model | quote }}
          envFrom:
            - secretRef:
                name: ppa-dun-secret
