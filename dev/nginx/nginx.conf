# HTTP → HTTPS redirect + Certbot challenge.
# Accepts both apex and legacy dev. subdomain so the ACME HTTP-01 challenge
# for ppa-dun.site can be served while the old cert is still active.
server {
    listen 80;
    server_name ppa-dun.site dev.ppa-dun.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name dev.ppa-dun.site;

    ssl_certificate /etc/letsencrypt/live/dev.ppa-dun.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.ppa-dun.site/privkey.pem;

    # Block dotfile requests (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 403;
    }

    location / {
        root /usr/share/nginx/html/fe;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://be:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /internal/* — webhook receiver from the Player API.
    # Auth enforced by FastAPI via X-Internal-Key + INTERNAL_WEBHOOK_KEY.
    location /internal/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://be:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin/* — manual demo entry points (fake notification, force refresh).
    # Auth enforced by FastAPI via X-Admin-Key + ADMIN_SECRET.
    location /admin/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://be:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
